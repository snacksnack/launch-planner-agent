[project]
name = "launch-planner-agent"
version = "0.1.0"
description = "Agentic migration/launch planner: PRD -> Gantt, critical path, RAID & status agents."
requires-python = ">=3.12"
# The root is a workspace aggregator; it depends on every member so `uv sync`
# installs the full monorepo into one venv (needed for import-linter + tests).
dependencies = [
    "launch-planner-api",
    "launch-planner-mcp",
    "planner-core",
    "agents",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "packages/planner-core", "packages/agents"]

[tool.uv.sources]
launch-planner-api = { workspace = true }
launch-planner-mcp = { workspace = true }
planner-core = { workspace = true }
agents = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "import-linter>=2",
    "httpx>=0.27",
]

# ---------------------------------------------------------------------------
# Tooling config (shared across the whole workspace)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-q"

# import-linter: enforce the architectural rules that the deterministic core can
# never depend on the LLM layer, and that the MCP layer can never reach a write
# path. Both are checked in CI via `lint-imports`.
#
# The MCP package is `mcp_server`, not `mcp` — `mcp` is the official SDK's own
# top-level package, so naming ours the same would both collide in site-packages
# and point these contracts at the SDK instead of at our code. See ADR-0027.
[tool.importlinter]
root_packages = ["planner_core", "agents", "app", "mcp_server"]
# Required because the forbidden contracts name external modules (anthropic).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "planner_core stays deterministic (no LLM / app / mcp imports)"
type = "forbidden"
source_modules = ["planner_core"]
forbidden_modules = ["agents", "app", "mcp_server", "anthropic"]

[[tool.importlinter.contracts]]
name = "layered architecture: mcp_server -> app -> agents -> planner_core"
type = "layers"
layers = ["mcp_server", "app", "agents", "planner_core"]

# RC1-236: the read-only boundary. The layers contract above says which
# direction imports may flow; this one narrows what the MCP layer may reach at
# all. `app.cli` owns every gated action — `plan commit`, `plan jira --real`,
# and the LLM verbs — so a tool cannot invoke one even by accident. Paired with
# the allowlist test in apps/mcp/tests; the contract stops a module being
# reachable, the allowlist stops a tool being exposed. Neither subsumes the other.
[[tool.importlinter.contracts]]
name = "mcp_server is read-only (no CLI write paths, no LLM)"
type = "forbidden"
source_modules = ["mcp_server"]
forbidden_modules = ["app.cli", "agents", "anthropic"]
