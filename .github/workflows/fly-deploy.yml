# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # No --build-arg GIT_SHA here, unlike tpm-automation-platform and
      # pr_agent: this Dockerfile declares no ARG GIT_SHA and sets no
      # DD_GIT_* / DD_VERSION, so the arg would only raise an unused
      # build-arg warning. RC1-337 skipped this image; add the arg here
      # when it carries git metadata.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
