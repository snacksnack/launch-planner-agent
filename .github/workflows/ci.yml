name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Enforce import direction (planner-core has no LLM deps)
        run: uv run lint-imports

      # RC1-452: --ddtrace reports test-level results to Test Optimization,
      # agentless. `--with` overlays ddtrace at test time only, so it never
      # joins the workspace dependencies and the planner-core import contract
      # is untouched. Not a test credential: the suite passes identically
      # with no key.
      - name: Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: launch-planner-agent
          DD_ENV: ci
        run: uv run --with "ddtrace>=4.14,<5" pytest --ddtrace
