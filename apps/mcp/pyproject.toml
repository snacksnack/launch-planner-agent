[project]
name = "launch-planner-mcp"
version = "0.1.0"
description = "MCP server exposing the planner as conversational tools. Read-only + simulate in v1."
requires-python = ">=3.12"
dependencies = [
    "planner-core",
    "launch-planner-api",
    "mcp>=2",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.scripts]
launch-planner-mcp = "mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is `launch-planner-mcp` and it lives at `apps/mcp/`, but the
# importable package is `mcp_server` — `mcp` is the official SDK's own top-level
# package, and two distributions cannot both own it in one venv. See ADR-0027.
[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
