<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch Planner — Gantt</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div>
          <h1 id="project-name">Launch Planner</h1>
          <p id="project-meta" class="meta">loading…</p>
        </div>
        <div class="toolbar">
          <label class="switch">
            <input type="checkbox" id="deps-toggle" />
            Dependencies
          </label>
          <label class="switch">
            <input type="checkbox" id="critical-toggle" />
            Critical path only
          </label>
          <button
            type="button"
            class="toolbtn"
            id="decisions-btn"
            title="Agent decisions & deterministic validation flags"
          >
            Decisions
          </button>
          <button
            type="button"
            class="toolbtn"
            id="audit-btn"
            title="How this plan was made — the reasoning chain"
          >
            How it's made
          </button>
          <button
            type="button"
            class="toolbtn"
            id="raid-btn"
            title="RAID log — risks, assumptions, issues, decisions"
          >
            RAID
          </button>
          <button
            type="button"
            class="toolbtn"
            id="baseline-btn"
            title="Compare the current plan against the committed baseline"
          >
            Baseline
          </button>
          <button
            type="button"
            class="toolbtn"
            id="status-btn"
            title="Weekly status update vs the committed baseline"
          >
            Status
          </button>
          <button
            type="button"
            class="toolbtn"
            id="jira-btn"
            title="Preview the Jira issues this plan would generate (mock — no writes)"
          >
            Jira
          </button>
          <button
            type="button"
            class="toolbtn"
            id="forecast-btn"
            title="Monte Carlo the launch date over the three-point estimates (P50/P80/P90)"
          >
            Forecast
          </button>
          <button
            type="button"
            class="toolbtn"
            id="simulate-btn"
            title="What-if: slip a task or edit dependencies and see the impact"
          >
            Simulate
          </button>
          <select id="view-mode" aria-label="View mode">
            <option value="Day">Day</option>
            <option value="Week" selected>Week</option>
            <option value="Month">Month</option>
          </select>
        </div>
      </header>

      <div id="legend" class="legend"></div>

      <div id="sim-banner" hidden>
        <span id="sim-banner-text"></span>
        <span class="sim-banner-actions">
          <button type="button" id="sim-view-toggle" class="sim-reset" hidden>Show baseline</button>
          <button type="button" id="sim-reset" class="sim-reset">Reset</button>
        </span>
      </div>

      <div class="layout">
        <div id="task-column">
          <div id="task-column-inner">
            <div class="task-col-header">Task</div>
          </div>
        </div>
        <div id="gantt-wrap">
          <div id="gantt"></div>
        </div>
        <aside id="detail">
          <p class="hint">Click a task or milestone to see its owner, float, and the
          full provenance behind it.</p>
        </aside>
        <button
          id="panel-toggle"
          class="icon-btn panel-tab"
          title="Hide details panel"
          aria-label="Toggle details panel"
        >›</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
