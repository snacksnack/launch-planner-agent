<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launch Planner — Gantt</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div>
          <h1 id="project-name">Launch Planner</h1>
          <p id="project-meta" class="meta">loading…</p>
        </div>
        <div class="toolbar">
          <label class="switch">
            <input type="checkbox" id="deps-toggle" />
            Dependencies
          </label>
          <label class="switch">
            <input type="checkbox" id="critical-toggle" />
            Critical path only
          </label>
          <select id="view-mode" aria-label="View mode">
            <option value="Day">Day</option>
            <option value="Week" selected>Week</option>
            <option value="Month">Month</option>
          </select>
        </div>
      </header>

      <div id="legend" class="legend"></div>

      <div class="layout">
        <div id="task-column">
          <div id="task-column-inner">
            <div class="task-col-header">Task</div>
          </div>
        </div>
        <div id="gantt-wrap">
          <div id="gantt"></div>
        </div>
        <aside id="detail">
          <p class="hint">Click a task or milestone to see its owner, float, and the
          full provenance behind it.</p>
        </aside>
        <button
          id="panel-toggle"
          class="icon-btn panel-tab"
          title="Hide details panel"
          aria-label="Toggle details panel"
        >›</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
