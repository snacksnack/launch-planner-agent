[project]
name = "launch-planner-evals"
version = "0.1.0"
description = "This repo's eval subjects: what is measured, on which cases, against which ceilings. The harness itself is agent-evals."
requires-python = ">=3.12"
dependencies = [
    "planner-core",
    "launch-planner-api",
    "launch-planner-mcp",
    # RC1-261: the reusable half — Case, run records, groundedness, the rubric
    # and the calibration machinery. Pinned to a tag rather than a branch: an
    # eval harness that changes under a run cannot tell you whether the subject
    # moved or the ruler did.
    "agent-evals[sql,llmobs]",
    # RC1-249: the tool-selection subject hands the shipped MCP surface to a real
    # model. `mcp` is here for the stdio client, not the server — the harness is
    # a client of `apps/mcp`, the same way any other MCP client is.
    "anthropic>=0.40",
    "mcp>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
evals = "evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution `launch-planner-evals` at `apps/evals/`, importable package
# `evals` — the same split `apps/mcp` uses (ADR-0027). Unlike that case there is
# no collision to dodge; the prefix is just the house style for `apps/*`.
[tool.hatch.build.targets.wheel]
packages = ["evals"]
