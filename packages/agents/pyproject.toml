[project]
name = "agents"
version = "0.1.0"
description = "LLM agents (work breakdown, dependency, RAID, status). Proposes; planner-core validates. Depends on planner-core, never the reverse."
requires-python = ">=3.12"
dependencies = [
    "planner-core",
    "anthropic>=0.40",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
