[project]
name = "planner-core"
version = "0.1.0"
description = "Deterministic planning core: task graph, dependency model, CPM/critical path, validation, plan-store models. Zero LLM dependencies."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_core"]
